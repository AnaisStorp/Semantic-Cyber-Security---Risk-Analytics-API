# GitHub Actions: runs on GitHub's servers on every push and pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  quality:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .


      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: Build & smoke-test image
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t scsra:ci .

      - name: Start container and probe health endpoint
        run: |
          docker run -d --name scsra -p 8501:8501 scsra:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8501/_stcore/health; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "container never became healthy"; docker logs scsra; exit 1


      - name: Container logs
        if: always()
        run: docker logs scsra
