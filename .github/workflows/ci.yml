name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.12"
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: Build & smoke-test image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t scsra:ci .

      # A successful build is not enough: the app must actually answer
      - name: Start container and probe health endpoint
        run: |
          docker run -d --name scsra -p 8501:8501 scsra:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8501/_stcore/health; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "container never became healthy"; exit 1

      - name: Container logs
        if: always()
        run: docker logs scsra
